<!-- Bill Generate Search Section -->
<section id="bill-generate-section" class="content-section">
  <h1>Bill Generation</h1>
  <div class="search-bar-container" style="margin-bottom: 20px;">
    <input type="text" id="billSearchInput" placeholder="Search by Name or Mobile No..." onkeyup="filterBillCustomers()" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
  </div>
  <div class="table-responsive">
    <table id="bill-customer-table">
      <thead><tr><th>Name</th><th>Mobile</th><th>Vehicle</th><th>Action</th></tr></thead>
      <tbody id="bill-customer-tbody"><tr><td colspan="4" class="text-center">Loading...</td></tr></tbody>
    </table>
  </div>
</section>

<!-- Bill Create & Edit Form Page -->
<section id="bill-create-page" class="content-section hidden">
  <button class="btn-secondary" onclick="toggleBillViews('search')" style="margin-bottom: 15px;"><i class="fa-solid fa-arrow-left"></i> Back</button>
  <h2><span id="billCustomerNameTitle" style="color: #2563eb;"></span></h2>
  
  <!-- Hidden fields for updating records -->
  <input type="hidden" id="activeBillCustId" value="">
  <input type="hidden" id="activeBillId" value="">
  
  <div class="form-card" style="margin-top: 15px;">
    <h3>Bill Details</h3>
    <div class="form-grid">
      <div class="form-group"><label>Vehicle Category</label><input type="text" id="billItem" readonly style="background: #e2e8f0;"></div>
      <!-- Company Name with Searchable Dropdown & Add Button -->
      <div class="form-group"><label>Company Name</label>
        <div class="select-with-btn">
          <select id="billCompany">
            <option value="">Select Company</option>
            <option value="YAKUZA">YAKUZA</option>
            <option value="KOMAKI">KOMAKI</option>
            <option value="OKINAVA">OKINAVA</option>
          </select>
          <button type="button" class="btn-small bg-blue" onclick="promptAddNewCompany()" title="Add Company"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <!-- Model Name with Searchable Dropdown & Add Button -->
      <div class="form-group"><label>Model</label>
        <div class="select-with-btn">
          <select id="billModel">
            <option value="">Select Model</option>
            <option value="CHERRY">CHERRY</option>
            <option value="Y1">Y1</option>
            <option value="DUSTER">DUSTER</option>
          </select>
          <button type="button" class="btn-small bg-blue" onclick="promptAddNewModel()" title="Add Model"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      <div class="form-group"><label>HSN</label><input type="text" id="billHsn" placeholder="e.g. 87116020"></div>
      <div class="form-group"><label>Chassis No</label><input type="text" id="billChassis" oninput="this.value = this.value.toUpperCase()"></div>
      <div class="form-group"><label>Engine No</label><input type="text" id="billEngine" oninput="this.value = this.value.toUpperCase()"></div>
      <div class="form-group"><label>Quantity (PCS)</label><input type="number" id="billQnty" value="1" oninput="calculateBillAmounts()"></div>
      <div class="form-group"><label>Rate (₹)</label><input type="number" id="billRate" placeholder="0.00" oninput="calculateBillAmounts()"></div>
      <div class="form-group"><label>Amount (₹)</label><input type="number" id="billAmount" readonly style="background: #e2e8f0;"></div>
      <div class="form-group"><label>SGST (%)</label><input type="number" id="billSgst" placeholder="0" oninput="calculateBillAmounts()"></div>
      <div class="form-group"><label>CGST (%)</label><input type="number" id="billCgst" placeholder="0" oninput="calculateBillAmounts()"></div>
      <div class="form-group"><label>IGST (%)</label><input type="number" id="billIgst" placeholder="0" oninput="calculateBillAmounts()"></div>
      <div class="form-group"><label>Total Amount (₹)</label><input type="text" id="billTotal" readonly style="background: #e2e8f0; font-weight: bold; color: #0f172a;"></div>
      <div class="form-group"><label>Battery Details</label><input type="text" id="billBattery" placeholder="e.g. GRAPHENE 60V 32AH" oninput="this.value = this.value.toUpperCase()"></div>
      <div class="form-group"><label>Battery Serial No</label><input type="number" id="billBatterySerial" min="0" step="1" inputmode="numeric" placeholder="Enter number only"></div>
      <div class="form-group"><label>Charger</label><input type="text" id="billCharger" placeholder="Enter charger details" oninput="this.value = this.value.toUpperCase()"></div>
      <div class="form-group"><label>Charger Serial No</label><input type="number" id="billChargerSerial" min="0" step="1" inputmode="numeric" placeholder="Enter number only"></div>
      <div class="form-group"><label>Battery Warranty</label><input type="number" id="billWarranty" min="0" step="1" inputmode="numeric" placeholder="Years"></div>
      
      <div class="form-group"><label>Bank Name</label>
        <div class="select-with-btn">
          <select id="billBankSelect" onchange="handleBankSelection(this)">
            <option value="">Select Bank</option>
            <option value="State Bank of India">State Bank of India</option>
            <option value="HDFC Bank">HDFC Bank</option>
          </select>
          <!-- Bank Add, Edit, Delete Buttons -->
          <button type="button" class="btn-small bg-blue" onclick="promptAddNewBank()" title="Add Bank"><i class="fa-solid fa-plus"></i></button>
          <button type="button" class="btn-small bg-yellow" onclick="editSelectedBank()" title="Edit Bank"><i class="fa-solid fa-pen" style="color:#000;"></i></button>
          <button type="button" class="btn-small bg-red" onclick="deleteSelectedBank()" title="Delete Bank"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" id="save-bill-btn" class="btn-primary bg-green" onclick="saveBillToDatabase()"><i class="fa-solid fa-floppy-disk"></i> Save Bill to Database</button>
    <button type="button" id="print-bill-btn" class="btn-print hidden" onclick="printGeneratedBill()"><i class="fa-solid fa-print"></i> Print / Save PDF</button>
  </div>
</section>
