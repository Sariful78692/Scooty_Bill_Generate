<section id="customer-details-section" class="content-section">
  <h1 id="details-view-title">Customer Details (All)</h1>

  <div class="customer-detail-controls">
    <!-- Search Box -->
    <div class="customer-search-wrap">
      <input type="text" id="customerSearchInput" placeholder="Search by Name or Mobile..." onkeyup="filterCustomerDetailsTable()" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
    </div>
    <div id="customer-branch-filter-group" class="customer-branch-filter" style="display:none;">
      <label for="customerBranchFilter">View Branch</label>
      <select id="customerBranchFilter" onchange="changeCustomerBranchFilter(this.value)" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;"></select>
    </div>
  </div>
  
  <div id="customer-pagination" style="margin:0 0 12px;"></div>
  <div class="table-responsive">
    <table id="customer-table">
      <thead id="customer-table-head">
        <tr><th>Photo</th><th>Name</th><th>Mobile</th><th>Vehicle</th><th>Company</th><th>Model</th><th>Actions</th></tr>
      </thead>
      <tbody id="customer-table-body">
        <tr><td colspan="7" class="text-center">Loading customers...</td></tr>
      </tbody>
    </table>
  </div>
</section>
