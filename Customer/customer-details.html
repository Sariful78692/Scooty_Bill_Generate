<section id="customer-details-section" class="content-section">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
    <h1 id="details-view-title" style="margin: 0;">Customer Details (All)</h1>
    
    <!-- Search Box -->
    <div style="flex: 1; max-width: 300px;">
      <input type="text" id="customerSearchInput" placeholder="Search by Name or Mobile..." onkeyup="filterCustomerDetailsTable()" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
    </div>
    <div>
      <label for="customerPageSize">Show</label>
      <select id="customerPageSize" onchange="filterCustomerDetailsTable()" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
        <option value="10">10</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>
  </div>
  
  <div class="table-responsive">
    <table id="customer-table">
      <thead id="customer-table-head">
        <tr><th>Photo</th><th>Name</th><th>Mobile</th><th>Vehicle</th><th>Company</th><th>Model</th><th>Actions</th></tr>
      </thead>
      <tbody id="customer-table-body">
        <tr><td colspan="7" class="text-center">Loading customers...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="customer-pagination" style="display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:12px;"></div>
</section>
