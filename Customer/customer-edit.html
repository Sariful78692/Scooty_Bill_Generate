<section id="customer-edit-section" class="content-section">
  <h1 id="form-title">Edit Customer Details</h1>
  <form id="customer-form">
    <!-- Hidden fields for storing existing IDs and Photo URLs during update -->
    <input type="hidden" id="edit-customer-id" value="">
    <input type="hidden" id="existing-photo-url" value="">

    <div class="form-card">
      <h3>Personal & Vehicle Details</h3>
      <div class="form-grid">
        <div class="form-group"><label>Customer Name *</label><input type="text" id="customerName" required></div>
        <div class="form-group"><label>Guardian Name *</label><input type="text" id="guardianName" required></div>
        <div class="form-group"><label>Gender *</label>
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group"><label>DOB *</label><input type="date" id="dob" required></div>
        <div class="form-group"><label>Religion</label><input type="text" id="religion"></div>
        <div class="form-group"><label>Aadhaar No *</label><input type="text" id="aadhaarNo" maxlength="12" required></div>
        <div class="form-group"><label>Mobile No *</label><input type="tel" id="mobileNo" maxlength="10" required></div>
        <div class="form-group"><label>Address *</label><input type="text" id="address" required></div>
        <div class="form-group"><label>Vehicle *</label>
          <select id="vehicleSelect" required>
            <option value="">Select Vehicle</option>
            <option value="Scooty">Scooty</option>
            <option value="Bike">Bike</option>
            <option value="Cycle">Cycle</option>
          </select>
        </div>
        <div class="form-group"><label>Chassis Number</label><input type="text" id="chassisNo"></div>
        <div class="form-group"><label>Engine Number</label><input type="text" id="engineNo"></div>
        <div class="form-group">
          <label>Update Photo (Max 50 KB)</label><input type="file" id="photoInput" accept="image/*">
          <div class="preview-box"><img id="photoPreview" src="" class="hidden-preview"></div>
        </div>
        <div class="form-group"><label>Occupation *</label>
          <div class="select-with-btn">
            <select id="occupationSelect" required>
              <option value="">Select Occupation</option>
              <option value="Labour">Labour</option>
              <option value="Service">Service</option>
              <option value="Self Employed">Self Employed</option>
            </select>
            <button type="button" class="btn-small bg-blue" onclick="promptAddNewOccupation()"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="form-actions">
      <!-- Edit form e Reset button er proyojon nei, tai Update ebong Cancel button dewa holo -->
      <button type="submit" id="submit-btn" class="btn-primary bg-yellow" style="color: #000;">Update Customer</button>
      <button type="button" id="cancel-btn" class="btn-danger" onclick="loadPage('customer/customer-details.html', 'customerDetails', 'all')">Cancel</button>
    </div>
  </form>
</section>
