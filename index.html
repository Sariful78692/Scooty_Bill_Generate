<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management System</title>
  <link rel="stylesheet" href="css-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container hidden">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2 style="font-size: 14px; text-align: center;">DINO ELECTRIC SCOOTY AND CYCLE SHOP</h2>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active" onclick="showSection('dashboard-section'); loadPage('Dashboard/dashboard.html', 'dashboard')"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        </li>
        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle"><i class="fa-solid fa-users"></i> Customer Info <i class="fa-solid fa-chevron-down arrow"></i></a>
          <ul class="submenu">
            <li><a href="#" onclick="loadPage('Customer/customer-entry.html', 'customerEntry')">Customer Entry</a></li>
            <li><a href="#" onclick="loadPage('Customer/customer-details.html', 'customerDetails', 'all')">Customer Details</a></li>
          </ul>
        </li>
        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle"><i class="fa-solid fa-motorcycle"></i> Vehicle <i class="fa-solid fa-chevron-down arrow"></i></a>
          <ul class="submenu" id="vehicle-submenu-list">
            <li><a href="#" onclick="loadPage('Customer/customer-details.html', 'customerDetails', 'Scooty')">Scooty</a></li>
            <li><a href="#" onclick="loadPage('Customer/customer-details.html', 'customerDetails', 'Bike')">Bike</a></li>
            <li><a href="#" onclick="loadPage('Customer/customer-details.html', 'customerDetails', 'Cycle')">Cycle</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" onclick="loadPage('bill/bill-generate.html', 'billGenerate')"><i class="fa-solid fa-file-invoice-dollar"></i> Bill Generate</a>
        </li>
        <!-- Report Menu -->
        <li class="nav-item">
          <a href="#" class="nav-link" onclick="loadPage('report/report.html', 'report')"><i class="fa-solid fa-file-lines"></i> Daily Report</a>
        </li>
      </ul>
      <div class="bottom-actions"><a href="#" class="nav-link settings-link" onclick="openSettings()"><i class="fa-solid fa-gear"></i> Settings</a><button class="logout-side" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>
    </aside>

    <main class="main-content" id="app-content">
      <!-- Pages will load here dynamically -->
    </main>
  </div>

  <script src="js-app.js"></script>
</body>
</html>
