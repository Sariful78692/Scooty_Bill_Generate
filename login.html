<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DINO ELECTRIC SCOOTY</title>

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Main CSS Link -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-page" id="login-page">
    <div class="login-layout">

      <!-- Left Side: Login Form -->
      <div class="login-card">
        <div class="login-brand">
          <i class="fa-solid fa-motorcycle login-logo text-blue"></i>
          <h1>DINO ELECTRIC</h1>
          <h2 class="card-brand-title">BRANCH LOGIN</h2>
        </div>

        <form id="login-form">
          <!-- Username with Icon -->
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="login-username" placeholder=" " required autocomplete="username">
            <label for="login-username">Branch Login ID</label>
          </div>

          <!-- Password with Icon + Eye Toggle -->
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder=" " required autocomplete="current-password">
            <label for="login-password">Password</label>
            <i class="fa-solid fa-eye toggle-eye" id="toggle-password"></i>
          </div>

          <div id="login-message" class="login-message"></div>

          <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; font-weight: bold;">
            <i class="fa-solid fa-right-to-bracket" style="margin-right: 5px;"></i> Login
          </button>

        </form>
      </div>

      <!-- Right Side: Welcome Image Card -->
      <div class="login-image-panel">
        <div class="login-welcome-card">
          <img src="https://www.yakuzaev.com/wp-content/uploads/2026/09/Y1-thumbnail-700x525.webp" alt="Yakuza electric vehicle">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYYA3YTFvv2eA-fxLYUmAySuBlk5rvoyO1lCI-JMkbfg&s=10" alt="Yakuza electric scooter">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvuO5QoDan4Jm5xhX-0mw1c4G6Lz1Giw_KttiEH_Pe0g&s=10" alt="Yakuza electric vehicle model">
        </div>
      </div>

    </div>
  </div>

  <!-- Script File for Login Logic -->
  <script src="js/core/login.js?v=2"></script>
</body>
</html>
