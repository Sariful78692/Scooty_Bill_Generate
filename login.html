<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dino Scooty Login</title><link rel="stylesheet" href="css-style.css"></head>
<body class="login-body"><main class="login-page"><div class="login-layout">
<div class="login-card"><h1 class="card-brand-title">DINO ELECTRIC SCOOTY</h1><div class="login-logo">🛵</div><form id="login-form"><input id="login-username" type="text" placeholder="Username" required><input id="login-password" type="password" placeholder="Password" required><button type="submit" class="btn-primary">Login</button></form><div class="login-links"><button type="button" onclick="forgotUsername()">Forgot Username?</button><button type="button" onclick="forgotPassword()">Forgot Password?</button></div><p id="login-message" class="login-message"></p></div>
<div class="login-image-panel"><img src="assets/scooty.svg" class="login-scooty-outside" alt="Dino Electric Scooty"><p>Electric mobility made simple</p></div>
</div></main><script src="login.js"></script></body></html>
